name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate (vendor denylist, manifests, skills, profiles, links)
        run: python .github/checks.py
      - name: Validate full deployable config example
        run: python scripts/validate-full-config.py
